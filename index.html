<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>لعبة الطفل المتحرك للموبايل</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(to top, #4facfe, #00f2fe);
      overflow: hidden;
    }
    canvas {
      display: block;
      margin: auto;
      background: #e0ffe0;
      border: 4px solid #333;
    }
    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: 80px 80px 80px;
      grid-template-rows: 80px 80px;
      gap: 15px;
    }
    .btn {
      background: #222;
      color: white;
      font-size: 32px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 15px;
      user-select: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      border: 3px solid #fff;
    }
    .btn:active {
      background: #444;
      transform: scale(0.95);
    }
    #up { background: #007bff; }     /* أزرق */
    #down { background: #28a745; }   /* أخضر */
    #left { background: #ffc107; }   /* أصفر */
    #right { background: #dc3545; }  /* أحمر */
  </style>
</head>
<body>
  <canvas id="game" width="800" height="600"></canvas>
  <div class="controls">
    <div></div>
    <div class="btn" id="up">⬆️</div>
    <div></div>
    <div class="btn" id="left">⬅️</div>
    <div class="btn" id="down">⬇️</div>
    <div class="btn" id="right">➡️</div>
  </div>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    let man, women, child;
    function initGame(){
      man = {x: 400, y: 300, size: 30, color: "#1e90ff"};
      women = [
        {x: 700, y: 500, size: 30, color: "#ff1493", speed: 3, mode:"chase"},
        {x: 100, y: 500, size: 30, color: "#ff69b4", speed: 2.5, mode:"mirror"},
        {x: 700, y: 100, size: 30, color: "#db7093", speed: 2.8, mode:"reverse"}
      ];
      child = {angle:0, size:25, color:"#ffa500"};
    }

    function drawRect(obj){
      ctx.fillStyle = obj.color;
      ctx.fillRect(obj.x, obj.y, obj.size, obj.size);
    }

    function drawEllipseBoundary(){
      ctx.strokeStyle = "#333";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.ellipse(canvas.width/2, canvas.height/2, 350, 250, 0, 0, Math.PI*2);
      ctx.stroke();
    }

    function insideEllipse(obj){
      let h = canvas.width/2;
      let k = canvas.height/2;
      let a = 350;
      let b = 250;
      let cx = obj.x + obj.size/2;
      let cy = obj.y + obj.size/2;
      return (((cx-h)**2)/(a*a) + ((cy-k)**2)/(b*b)) <= 1;
    }

    let lastDx=0, lastDy=0; 

    function update(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      drawEllipseBoundary();

      // حركة الطفل داخل القطع الناقص
      child.angle += 0.02;
      child.x = canvas.width/2 + 300 * Math.cos(child.angle);
      child.y = canvas.height/2 + 200 * Math.sin(child.angle);
      drawRect(child);

      drawRect(man);
      women.forEach(w => drawRect(w));

      // حركة النساء
      women.forEach(w=>{
        if(w.mode==="chase"){
          let dx = child.x - w.x;
          let dy = child.y - w.y;
          let dist = Math.sqrt(dx*dx+dy*dy);
          if(dist>1){
            w.x += (dx/dist)*w.speed;
            w.y += (dy/dist)*w.speed;
            if(!insideEllipse(w)){ w.x -= (dx/dist)*w.speed; w.y -= (dy/dist)*w.speed; }
          }
        } else if(w.mode==="mirror"){
          w.x += lastDx*0.8;
          w.y += lastDy*0.8;
          if(!insideEllipse(w)){ w.x -= lastDx*0.8; w.y -= lastDy*0.8; }
        } else if(w.mode==="reverse"){
          w.x -= lastDx*0.8;
          w.y -= lastDy*0.8;
          if(!insideEllipse(w)){ w.x += lastDx*0.8; w.y += lastDy*0.8; }
        }

        // تماس بين الرجل والمرأة → الطفل يتغيّر مكانه
        if(Math.abs(man.x-w.x)<20 && Math.abs(man.y-w.y)<20){
          child.angle += Math.PI/2; // تغيير موقع الطفل فجأة
        }
      });

      // لمس الطفل → إضافة 3 نسخ جديدة من البنات
      if(Math.abs(man.x-child.x)<20 && Math.abs(man.y-child.y)<20){
        for(let i=0;i<3;i++){
          women.push({
            x: Math.floor(Math.random()*(canvas.width-100))+50,
            y: Math.floor(Math.random()*(canvas.height-100))+50,
            size: 30,
            color: "#c71585",
            speed: 2.5,
            mode: (i%2===0?"chase":"reverse")
          });
        }
      }

      requestAnimationFrame(update);
    }

    // تحكم باللمس للموبايل
    document.getElementById("up").addEventListener("touchstart",()=>{ move(0,-10); });
    document.getElementById("down").addEventListener("touchstart",()=>{ move(0,10); });
    document.getElementById("left").addEventListener("touchstart",()=>{ move(-10,0); });
    document.getElementById("right").addEventListener("touchstart",()=>{ move(10,0); });

    function move(dx,dy){
      man.x += dx;
      man.y += dy;
      if(!insideEllipse(man)){ man.x -= dx; man.y -= dy; }
      lastDx = dx;
      lastDy = dy;
    }

    initGame();
    update();
  </script>
</body>
</html>
